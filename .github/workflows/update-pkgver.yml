name: Update PKGBUILD versions

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-pkgver
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LOG_LEVEL: info
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump PKGBUILD versions
        run: |
          docker run --rm \
            -e LOG_LEVEL \
            -e GITHUB_TOKEN \
            -v "$PWD:/work" \
            -w /work \
            archlinux:base-devel \
            bash /work/.github/scripts/run-in-arch.sh

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          list=".nvchecker/updated-packages.txt"
          if [[ ! -f "$list" ]]; then
            echo "missing $list" >&2
            exit 1
          fi
          if [[ ! -s "$list" ]]; then
            echo "no package updates"
            exit 0
          fi
          if git diff --quiet -- '*/PKGBUILD' '*/.SRCINFO'; then
            echo "updater reported packages but the tree has no PKGBUILD/.SRCINFO diff" >&2
            exit 1
          fi
          git add -- '*/PKGBUILD' '*/.SRCINFO'
          packages=$(tr '\n' ' ' < "$list" | sed 's/[[:space:]]*$//')
          git commit -m "upgpkg: ${packages}"
          git push origin HEAD
