name: Update and publish pacman repository

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      check_updates:
        description: Check upstream versions before building
        type: boolean
        default: true
  push:
    branches: [master]
    paths:
      - '*/**'
      - '.github/**'
      - 'repository.toml'
      - 'nvchecker.toml'

permissions:
  contents: read

# Never interrupt a release while replacing its repository indexes.
concurrency:
  group: publish-personal-x86_64
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate publishing credentials
        env:
          GH_TOKEN: ${{ secrets.REPO_PUBLISH_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Missing REPO_PUBLISH_TOKEN' >&2; exit 1; }
          python3 - <<'PYTHON'
          import subprocess
          import tomllib
          with open("repository.toml", "rb") as stream:
              config = tomllib.load(stream)
          subprocess.run([
              "gh", "api",
              f"repos/{config['repository']}/releases/tags/{config['release']}",
              "--silent",
          ], check=True)
          PYTHON
      - name: Prebuild deepseek-harness Linux x86_64 release if upstream tag updated
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.check_updates)
        env:
          LOG_LEVEL: info
          GH_TOKEN: ${{ secrets.REPO_PUBLISH_TOKEN }}
        run: python3 .github/scripts/prebuild-deepseek-harness.py
      - name: Bump PKGBUILD versions
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.check_updates)
        env:
          LOG_LEVEL: info
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e LOG_LEVEL -e GITHUB_TOKEN \
            -v "$PWD:/work" -w /work \
            archlinux:base-devel bash /work/.github/scripts/run-in-arch.sh
      - name: Commit version updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git diff --quiet -- '*/PKGBUILD' '*/.SRCINFO'; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- '*/PKGBUILD' '*/.SRCINFO'
            git commit -m 'Update package versions'
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:master
          fi
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - name: Build packages without signing or publishing credentials
        run: |
          mkdir -p "$RUNNER_TEMP/build-source" "$RUNNER_TEMP/packages"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/build-source"
          docker run --rm \
            -v "$RUNNER_TEMP/build-source:/work" \
            -v "$RUNNER_TEMP/packages:/out" -w /work \
            archlinux:base-devel bash /work/.github/scripts/build-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages-x86_64
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: packages-x86_64
          path: ${{ runner.temp }}/packages
      - name: Pull repository tooling
        run: docker pull archlinux:base-devel
      - name: Sign and publish
        env:
          GH_TOKEN: ${{ secrets.REPO_PUBLISH_TOKEN }}
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          REPO_SIGNING_PASSPHRASE: ${{ secrets.REPO_SIGNING_PASSPHRASE }}
        run: python3 .github/scripts/publish-repository.py --packages "$RUNNER_TEMP/packages"
